<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PelisToday2</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="contenedor">

        <h1>PelisToday2</h1>

        <!-- BUSCAR PELÍCULA -->
        <section class="bloque">

            <h2>Buscar película</h2>

            <label for="buscarNombre">
                Título de la película:
            </label>

            <input
                type="text"
                id="buscarNombre"
                placeholder="Ejemplo: Titanic"
            >

            <button type="button" id="buscarPelicula">
                Buscar
            </button>

            <div id="resultado"></div>

        </section>

        <!-- CREAR PELÍCULA -->
        <section class="bloque">

            <h2>Crear película</h2>

            <label for="peliculaNombre">
                Nombre:
            </label>

            <input
                type="text"
                id="peliculaNombre"
                placeholder="Ejemplo: Titanic"
            >

            <label for="peliculaAno">
                Año de publicación:
            </label>

            <input
                type="number"
                id="peliculaAno"
                placeholder="Ejemplo: 1997"
            >

            <label for="peliculaActores">
                Actores:
            </label>

            <input
                type="text"
                id="peliculaActores"
                placeholder="Ejemplo: Leonardo DiCaprio, Kate Winslet, Billy Zane"
            >

            <button type="button" id="crearPelicula">
                Crear película
            </button>

        </section>

        <!-- MODIFICAR PELÍCULA -->
        <section class="bloque">

            <h2>Modificar película</h2>

            <label for="modificarPeliculaId">
                ID de la película:
            </label>

            <input
                type="number"
                id="modificarPeliculaId"
                placeholder="Ejemplo: 1"
            >

            <label for="modificarPeliculaNombre">
                Nuevo nombre:
            </label>

            <input
                type="text"
                id="modificarPeliculaNombre"
                placeholder="Nuevo nombre"
            >

            <label for="modificarPeliculaAno">
                Nuevo año:
            </label>

            <input
                type="number"
                id="modificarPeliculaAno"
                placeholder="Nuevo año"
            >

            <label for="modificarPeliculaActores">
                Nuevos actores:
            </label>

            <input
                type="text"
                id="modificarPeliculaActores"
                placeholder="Ejemplo: Leonardo DiCaprio, Kate Winslet"
            >

            <button type="button" id="modificarPelicula">
                Modificar película
            </button>

        </section>

        <!-- BORRAR PELÍCULA -->
        <section class="bloque">

            <h2>Borrar película</h2>

            <label for="borrarPeliculaNombre">
                Nombre de la película:
            </label>

            <input
                type="text"
                id="borrarPeliculaNombre"
                placeholder="Ejemplo: Titanic"
            >

            <button type="button" id="borrarPelicula">
                Borrar película
            </button>

        </section>

        <!-- CREAR ACTOR -->
        <section class="bloque">

            <h2>Crear actor</h2>

            <label for="actorNombre">
                Nombre completo:
            </label>

            <input
                type="text"
                id="actorNombre"
                placeholder="Ejemplo: Leonardo DiCaprio"
            >

            <label for="actorFecha">
                Fecha de nacimiento:
            </label>

            <input
                type="date"
                id="actorFecha"
            >

            <button type="button" id="crearActor">
                Crear actor
            </button>

        </section>

        <!-- MODIFICAR ACTOR -->
        <section class="bloque">

            <h2>Modificar actor</h2>

            <label for="modificarActorId">
                ID del actor:
            </label>

            <input
                type="number"
                id="modificarActorId"
                placeholder="Ejemplo: 1"
            >

            <label for="modificarActorNombre">
                Nuevo nombre:
            </label>

            <input
                type="text"
                id="modificarActorNombre"
                placeholder="Nuevo nombre"
            >

            <label for="modificarActorFecha">
                Nueva fecha de nacimiento:
            </label>

            <input
                type="date"
                id="modificarActorFecha"
            >

            <button type="button" id="modificarActor">
                Modificar actor
            </button>

        </section>

        <!-- BORRAR ACTOR -->
        <section class="bloque">

            <h2>Borrar actor</h2>

            <label for="borrarActorNombre">
                Nombre del actor:
            </label>

            <input
                type="text"
                id="borrarActorNombre"
                placeholder="Ejemplo: Leonardo DiCaprio"
            >

            <button type="button" id="borrarActor">
                Borrar actor
            </button>

        </section>

        <!-- MENSAJES DE LAS OPERACIONES -->
        <div id="mensaje"></div>

    </main>

</body>
</html>
